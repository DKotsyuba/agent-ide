name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.4.0"
      - name: Verify runner
        run: test "$(uname -m)" = arm64
      - name: Prepare toolchains
        run: |
          rustup component add rustfmt clippy rust-analyzer rust-src
          npm install --global pyright@1.1.413 typescript-language-server@6.0.0 typescript@5.9.3
          npm_root="$(npm root --global)"
          echo "AGENT_IDE_RUST_ANALYZER=$(rustup which rust-analyzer)" >> "$GITHUB_ENV"
          echo "AGENT_IDE_RUST_TOOLCHAIN=$(rustup show active-toolchain | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "AGENT_IDE_RUST_TOOLCHAIN_DIR=$(rustc --print sysroot)" >> "$GITHUB_ENV"
          echo "AGENT_IDE_PYRIGHT=$(command -v pyright-langserver)" >> "$GITHUB_ENV"
          echo "AGENT_IDE_NODE=$(command -v node)" >> "$GITHUB_ENV"
          echo "AGENT_IDE_TYPESCRIPT_LANGUAGE_SERVER=$npm_root/typescript-language-server/lib/cli.mjs" >> "$GITHUB_ENV"
          echo "AGENT_IDE_TSSERVER=$npm_root/typescript/lib/tsserver.js" >> "$GITHUB_ENV"
      - name: Fetch dependencies
        run: cargo fetch --locked
      - name: Gate
        # The xtask gate is the exact former inline gate — fmt, the locked workspace tests with
        # --test-threads=1, the four ignored provider tests,
        # clippy -D warnings, rustdoc -D warnings, the release build — with --no-fail-fast,
        # plus the family standard and contract-snapshot checks.
        run: cargo xtask check
  linux-package-contract:
    runs-on: ubuntu-24.04
    env:
      TMPDIR: ${{ runner.temp }}
      TMP: ${{ runner.temp }}
      TEMP: ${{ runner.temp }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check workspace targets with test seams and Jev
        run: cargo check --locked --workspace --all-targets --features test-seams,jev-pilot
      - name: Check Linux TypeScript declarations and byte remeasurement
        run: cargo test --locked -p agent-ide-lang-typescript --lib backend::linux_tests:: -- --test-threads=1
      - name: Check Linux TypeScript evidence command refusals
        run: cargo test --locked -p agent-ide --bin agent-ide --features test-seams,jev-pilot typescript_evidence_rejects_invalid_argv_and_unpinned_files -- --test-threads=1
      - name: Check Linux runtime parent selection
        run: cargo test --locked -p agent-ide-core --lib --features test-seams,jev-pilot linux_runtime_parent_prefers_private_runtime_and_validates_xdg -- --test-threads=1
      - run: cargo test --locked -p xtask linux_elf_target_rejects_wrong_abi_and_machine
      - run: sh -n install.sh scripts/package-release.sh scripts/release-smoke.sh
  dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo deny --locked check
