name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false
      - name: Verify runner
        run: test "$(uname -m)" = arm64
      - name: Prepare toolchains
        run: |
          rustup component add rustfmt clippy rust-analyzer rust-src
          go install golang.org/x/tools/gopls@v0.23.0
          echo "AGENT_IDE_GOPLS=$(go env GOPATH)/bin/gopls" >> "$GITHUB_ENV"
          echo "AGENT_IDE_GO=$(command -v go)" >> "$GITHUB_ENV"
          echo "AGENT_IDE_RUST_ANALYZER=$(rustup which rust-analyzer)" >> "$GITHUB_ENV"
          echo "AGENT_IDE_RUST_TOOLCHAIN_DIR=$(rustc --print sysroot)" >> "$GITHUB_ENV"
      - run: cargo fmt --check
      - run: cargo test --locked --workspace -- --test-threads=1
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --locked --workspace --no-deps
      - run: cargo build --locked --release --bin agent-ide
