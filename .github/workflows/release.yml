name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24.4.0"
      - name: Verify tag and runner
        run: |
          test "$(uname -m)" = arm64
          version="${GITHUB_REF_NAME#v}"
          manifest_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "agent-ide") | .version')"
          test "$version" = "$manifest_version"
          test "$version" = "$(jq -r .version .codex-plugin/plugin.json)"
          test "$version" = "$(jq -r .version .claude-plugin/plugin.json)"
          test "$version" = "$(jq -r .plugins[0].version .claude-plugin/marketplace.json)"
      - name: Prepare accepted toolchains
        run: |
          rustup component add rustfmt clippy rust-analyzer rust-src
          npm install --global pyright@1.1.413 typescript-language-server@6.0.0 typescript@5.9.3
          npm_root="$(npm root --global)"
          echo "AGENT_IDE_RUST_ANALYZER=$(rustup which rust-analyzer)" >> "$GITHUB_ENV"
          echo "AGENT_IDE_RUST_TOOLCHAIN=$(rustup show active-toolchain | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "AGENT_IDE_RUST_TOOLCHAIN_DIR=$(rustc --print sysroot)" >> "$GITHUB_ENV"
          echo "AGENT_IDE_NODE=$(command -v node)" >> "$GITHUB_ENV"
          echo "AGENT_IDE_PYRIGHT=$(command -v pyright-langserver)" >> "$GITHUB_ENV"
          echo "AGENT_IDE_TYPESCRIPT_LANGUAGE_SERVER=$npm_root/typescript-language-server/lib/cli.mjs" >> "$GITHUB_ENV"
          echo "AGENT_IDE_TSSERVER=$npm_root/typescript/lib/tsserver.js" >> "$GITHUB_ENV"
      - name: Run complete quality gates
        # Go and gopls are outside the v0.6.9 release scope: the runner installs no Go toolchain,
        # so the workspace gate skips exactly the three real-gopls toolchain contracts by name and
        # still runs every other workspace test.
        run: |
          cargo fmt --all --check
          cargo test --locked --workspace -- --test-threads=1 --skip real_gopls_production_context_tracks_exact_observed_bytes --skip shared_gopls_isolates_divergent_worktrees_and_detaches_one_view --skip dropping_live_gopls_owner_closes_its_owned_listener
          cargo clippy --locked --workspace --all-targets -- -D warnings
          RUSTDOCFLAGS="-D warnings" cargo doc --locked --workspace --no-deps
      - name: Run candidate product acceptance
        run: scripts/macos-acceptance.sh --route product --evidence "$RUNNER_TEMP/product-evidence.json"
      - name: Validate accepted candidate host evidence
        run: scripts/validate-release-evidence.sh "$GITHUB_SHA"
      - name: Build release executable
        run: cargo build --locked --release --bin agent-ide
      - name: Package
        run: |
          asset="$(scripts/package-release.sh target/release/agent-ide "$GITHUB_REF_NAME" .)"
          echo "ASSET=$asset" >> "$GITHUB_ENV"
      - name: Smoke packaged executable
        run: scripts/release-smoke.sh "$ASSET"
      - name: Build the aggregate release checksum manifest
        # Manifest entries are bare asset names: the bootstrap looks the tarball up by its name.
        run: shasum -a 256 "$(basename "$ASSET")" install.sh > SHA256SUMS
      - name: Attest build provenance
        # GitHub keeps attestations for public repositories only ("Feature not available for
        # user-owned private repositories"); the step returns once the repository is public.
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$ASSET" install.sh SHA256SUMS --verify-tag --generate-notes --title "Agent IDE $GITHUB_REF_NAME"
