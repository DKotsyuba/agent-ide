name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag and runner
        run: |
          test "$(uname -m)" = arm64
          version="${GITHUB_REF_NAME#v}"
          manifest_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "agent-ide") | .version')"
          test "$version" = "$manifest_version"
      - name: Build
        run: |
          cargo test --locked --lib --bin agent-ide
          cargo build --locked --release --bin agent-ide
      - name: Package
        run: |
          asset="agent-ide-${GITHUB_REF_NAME}-aarch64-apple-darwin.tar.gz"
          mkdir -p package
          cp target/release/agent-ide package/agent-ide
          chmod 755 package/agent-ide
          touch -t 197001010000 package/agent-ide
          COPYFILE_DISABLE=1 tar -cf - -C package agent-ide | gzip -n > "$asset"
          shasum -a 256 "$asset" > SHA256SUMS
          echo "ASSET=$asset" >> "$GITHUB_ENV"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$ASSET" SHA256SUMS --verify-tag --generate-notes --title "Agent IDE $GITHUB_REF_NAME"
