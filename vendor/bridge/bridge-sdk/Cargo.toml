[package]
name = "bridge-sdk"
version = "0.2.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT"
publish = false

[dependencies]
bridge-protocol = { version = "=0.2.0", path = "../bridge-protocol" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
socket2 = "=0.6.5"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
