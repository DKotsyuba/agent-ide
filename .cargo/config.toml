# Keeps every test-spawned daemon/MCP process (which inherit this) out of the developer's real
# `~/.agent-ide`: per-user state resolves from `AGENT_IDE_HOME` (see `agent_ide::userhome`).
[env]
AGENT_IDE_HOME = { value = "target/test-home", relative = true }
# Test-seams builds only: keeps the typed `structuredContent` copy of non-Claude replies as the
# product tests' oracle. Production replies are text-only (harness-reply-v1 R1); a release
# build never reads this variable.
AGENT_IDE_TEST_STRUCTURED_REPLIES = "1"

[alias]
xtask = "run --locked --package xtask --"
