[workspace]
members = ["crates/*"]

[workspace.package]
version = "0.4.5"
edition = "2024"

[package]
name = "agent-ide"
version.workspace = true
edition.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
agent-ide-core = { path = "crates/agent-ide-core" }
agent-ide-lang-typescript = { path = "crates/agent-ide-lang-typescript" }
agent-ide-lang-python = { path = "crates/agent-ide-lang-python" }
agent-ide-lang-rust = { path = "crates/agent-ide-lang-rust" }
agent-ide-lang-go = { path = "crates/agent-ide-lang-go" }
async-lsp = { version = "0.2.4", default-features = false, features = ["omni-trait", "tokio"] }
blake3 = "1"
libc = "0.2"
minijinja = { version = "2.24.0", default-features = false, features = ["serde", "builtins"] }
rmcp = { version = "3.2.0", features = ["server", "macros", "transport-io"] }
rusqlite = { version = "0.37", features = ["backup", "bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }
tower-service = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
