[package]
name = "agent-ide"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
async-lsp = { version = "0.2.4", default-features = false, features = ["omni-trait", "tokio"] }
blake3 = "1"
rmcp = { version = "3.2.0", features = ["server", "macros", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }
