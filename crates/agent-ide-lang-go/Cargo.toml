[package]
name = "agent-ide-lang-go"
version.workspace = true
edition.workspace = true
publish = false
description = "The Go language for Agent IDE: symbol support and the shared gopls server."

[lib]
path = "src/lib.rs"

[dependencies]
agent-ide-core = { path = "../agent-ide-core" }
async-lsp = { version = "0.2.4", default-features = false, features = ["omni-trait", "tokio"] }
blake3 = "1"
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
