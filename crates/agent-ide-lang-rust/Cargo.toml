[package]
name = "agent-ide-lang-rust"
version.workspace = true
edition.workspace = true
publish = false
description = "The Rust language for Agent IDE: symbol support, cargo check and rust-analyzer."

[lib]
path = "src/lib.rs"

[dependencies]
agent-ide-core = { path = "../agent-ide-core" }
async-lsp = { version = "0.2.4", default-features = false, features = ["omni-trait", "tokio"] }
blake3 = "1"
proc-macro2 = { version = "1", default-features = false, features = ["span-locations"] }
quote = { version = "1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pinned: an upgrade repeats the audit of `verbatim::between` triggers and the stack measurements in src/lexical.rs.
syn = { version = "=2.0.119", default-features = false, features = ["full", "parsing", "printing", "visit"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
