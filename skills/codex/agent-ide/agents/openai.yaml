interface:
  display_name: "Agent IDE"
  short_description: "Language-server-backed ide.* tools for reading, editing and testing source"
  default_prompt: "Use $agent-ide: ide.start, then find an address with ide.outline or ide.symbol, read it with ide.read, change it with ide.edit, run ide.test, review with ide.diff, and end with ide.stop."
